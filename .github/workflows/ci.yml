name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: secondsite, POSTGRES_PASSWORD: secondsite, POSTGRES_DB: secondsite_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secondsite" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://secondsite:secondsite@localhost:5432/secondsite_test
      DATABASE_URL: postgresql+psycopg://secondsite:secondsite@localhost:5432/secondsite_test
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Tests (contracts, domain, API, events, approvals, webhooks)
        run: uv run pytest -q
      - name: Migrations apply cleanly and match models
        run: uv run alembic upgrade head && uv run alembic check

  contracts-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: (cd apps/api && uv sync --frozen)
      - run: pnpm install --frozen-lockfile
      - name: Generated contracts are up to date
        run: scripts/check-contracts.sh
      - name: Web typecheck
        run: pnpm --filter @second-site/web typecheck
      - name: Web lint
        run: pnpm --filter @second-site/web lint
      - name: Web build
        run: pnpm --filter @second-site/web build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml config -q

  board-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n tools/board && bash -n .claude/hooks/board-prompt.sh && bash -n .claude/hooks/board-session-start.sh
      - run: python3 -m json.tool .claude/settings.json > /dev/null

  backend-rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: secondsite, POSTGRES_PASSWORD: secondsite, POSTGRES_DB: secondsite_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secondsite" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The Rust tests create one schema per test in this database and migrate it themselves.
      TEST_DATABASE_URL: postgresql+psycopg://secondsite:secondsite@localhost:5432/secondsite_test
      CARGO_TERM_COLOR: always
      # Keep the build small. The hosted runner has little free disk: a debug build with full debug
      # info on top of a restored target directory that grew with every run filled it, and the
      # linker died with a bus error. No debug info, no incremental data.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults: { run: { working-directory: apps/backend } }
    steps:
      - uses: actions/checkout@v4
      - name: Stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # Exact key only (no restore-keys): a cache is built from scratch whenever Cargo.lock changes,
      # so stale artifacts of earlier builds never pile up in it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: rust-v2-${{ runner.os }}-${{ hashFiles('apps/backend/Cargo.lock') }}
      - name: Disk space before the build
        run: df -h / | tail -1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (in-memory store and PostgreSQL 16)
        run: cargo test --workspace
