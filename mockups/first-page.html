<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#fff; --ink2:rgba(255,255,255,.82); --mute:rgba(255,255,255,.6);
    --black:rgba(8,8,14,.72); --black2:rgba(8,8,14,.45); --blur:20px;
    --ok:#8fe0ad; --work:#ffcf86; --unknown:rgba(255,255,255,.55); --r:18px;
    --sans:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif; --ease:cubic-bezier(.65,0,.35,1);
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100%; overflow:hidden; background:#262a5e; color:var(--ink); font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer }
  #bg { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0 }
  #grain { position:fixed; inset:0; z-index:0; pointer-events:none; mix-blend-mode:overlay; opacity:var(--grain,.35) }

  .app { position:relative; z-index:1; height:100vh; display:grid; gap:20px; padding:24px 24px 24px 32px;
    grid-template-columns:minmax(0,1fr) clamp(320px,28vw,420px); grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"brand chat" "strip chat" "stage chat" }
  .app > * { min-width:0 }
  .brand { grid-area:brand; display:flex; align-items:center; gap:16px }
  .logo { font-size:19px; font-weight:600; letter-spacing:-.01em }
  .tw-btn { font-size:12px; color:var(--mute); padding:4px 8px; border-radius:8px }
  .tw-btn:hover { color:#fff }

  /* ranked spaces */
  .strip { grid-area:strip; display:flex; gap:16px; overflow-x:auto; scrollbar-width:none; padding:4px 2px 6px; margin:-4px -2px -6px }
  .strip::-webkit-scrollbar { display:none }
  .card { flex:0 0 clamp(200px,17vw,250px); text-align:left; transition:transform .45s var(--ease), opacity .4s }
  .card .img { position:relative; aspect-ratio:16/9; border-radius:var(--r); overflow:hidden; background:var(--black2) }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s var(--ease), filter .4s }
  .card:hover { transform:translateY(-4px) }
  .card:hover img { transform:scale(1.05) }
  .card:not(.sel) { opacity:.78 }
  .card.sel .img { box-shadow:0 16px 36px rgba(10,8,40,.4) }
  .rank { position:absolute; left:10px; top:10px; min-width:26px; height:26px; padding:0 8px; border-radius:13px; background:var(--black); font-size:13px; font-weight:600; display:grid; place-items:center }
  .move { position:absolute; right:10px; top:10px; font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--black) }
  .card .meta { padding:9px 2px 0; display:grid; gap:1px }
  .card .addr { font-weight:500 }
  .card .num { font-weight:600 }
  .card .num small { font-weight:400; color:var(--mute) }
  .card .why { font-size:13px; color:var(--mute) }
  .card .reason { font-size:13px; color:var(--work) }
  .card.out img { filter:grayscale(1) brightness(.65) }
  .card.out .num { color:var(--mute) }
  .card .num .struck { text-decoration:line-through }

  /* visual + facts */
  .stage { grid-area:stage; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:14px }
  .tabs { display:flex; gap:2px; padding:4px; border-radius:14px; background:var(--black2); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)); justify-self:start; max-width:100%; overflow-x:auto; scrollbar-width:none }
  .tabs button, .tabs a { padding:7px 14px; border-radius:10px; font-size:13px; color:var(--ink2); white-space:nowrap; text-decoration:none; transition:background .25s,color .25s }
  .tabs button:hover, .tabs a:hover { color:#fff }
  .tabs button.on { background:rgba(255,255,255,.18); color:#fff }
  .tabs a { color:var(--mute) }
  .view { position:relative; min-height:0; border-radius:var(--r); overflow:hidden }
  .layer { position:absolute; inset:0; will-change:transform,opacity,filter }
  .layer img { display:block; width:100%; height:100%; object-fit:cover; border-radius:var(--r) }
  .layer.float img { object-fit:contain; border-radius:0; padding:1% 2%; filter:drop-shadow(0 30px 40px rgba(15,12,50,.45)) }
  .layer.kb img { animation:kb 16s ease-in-out infinite alternate }
  @keyframes kb { from { transform:scale(1) } to { transform:scale(1.07) translate(-1%,-1%) } }
  .src { position:absolute; left:12px; bottom:12px; z-index:2; font-size:12px; padding:3px 9px; border-radius:8px; background:var(--black) }

  .facts { display:grid; gap:12px; padding:14px 18px; border-radius:var(--r); background:var(--black2); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)) }
  .facts h2 { grid-column:1/-1; font-size:15px; font-weight:600; display:flex; gap:10px; align-items:baseline }
  .facts h2 span { font-weight:400; color:var(--mute); font-size:13px }
  .row1 { display:flex; align-items:center; gap:28px; flex-wrap:wrap }
  .nums { display:flex; gap:28px; flex-wrap:wrap }
  .n b { display:block; font-size:20px; font-weight:600; letter-spacing:-.01em }
  .n span { font-size:12px; color:var(--mute) }
  .n.over b { color:#ffb4a6 }
  .checks { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px 20px }
  @media (max-width:1350px) { .checks { grid-template-columns:1fr 1fr } }
  .check { display:grid; grid-template-columns:10px 1fr; gap:2px 10px; align-items:baseline }
  .dot { width:8px; height:8px; border-radius:50%; align-self:center }
  .ok .dot { background:var(--ok) } .work .dot { background:var(--work) } .unknown .dot { box-shadow:inset 0 0 0 1.5px var(--unknown) }
  .check b { font-weight:500; font-size:14px }
  .check span { grid-column:2; font-size:12.5px; color:var(--mute) }
  .check.flash { animation:flash 1.6s var(--ease) }
  @keyframes flash { 30% { opacity:.4 } }
  .next { margin-left:auto; display:flex; align-items:center; gap:12px; min-width:0 }
  .next p { font-size:13.5px; color:var(--ink2); max-width:320px }
  .next button { padding:7px 14px; border-radius:10px; background:#fff; color:#15152a; font-weight:500; font-size:14px; white-space:nowrap }
  .next button.done { background:rgba(255,255,255,.18); color:#fff }

  /* chat, right */
  .chat { grid-area:chat; min-height:0; display:flex; flex-direction:column; gap:10px }
  .msgs { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; justify-content:flex-end; scrollbar-width:none }
  .msgs::-webkit-scrollbar { display:none }
  .b { max-width:88%; padding:11px 14px; border-radius:18px; background:var(--black); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)); font-size:14.5px; line-height:1.45; animation:in .35s var(--ease) }
  .b.ai { align-self:flex-start; border-bottom-left-radius:6px }
  .b.me { align-self:flex-end; border-bottom-right-radius:6px; background:var(--black2) }
  @keyframes in { from { opacity:0; transform:translateY(6px) } }
  .caret { display:inline-block; width:7px; height:14px; margin-left:2px; background:#fff; opacity:.7; vertical-align:-2px; animation:blink 1s steps(2) infinite }
  @keyframes blink { 50% { opacity:0 } }
  form { display:flex; align-items:center; gap:8px; padding:5px 5px 5px 16px; border-radius:22px; background:var(--black); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)) }
  input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; color:#fff }
  input::placeholder { color:var(--mute) }
  .send { width:36px; height:36px; border-radius:50%; background:#fff; color:#15152a; font-size:16px; flex:none }

  .tweaks { position:fixed; left:32px; top:60px; z-index:5; width:280px; padding:14px; display:grid; gap:10px; font-size:12.5px; max-height:80vh; overflow:auto; border-radius:16px; background:rgba(8,8,14,.8); backdrop-filter:blur(20px) }
  .tweaks[hidden] { display:none }
  .tweaks .row { display:grid; grid-template-columns:90px 1fr 40px; align-items:center; gap:8px }
  .tweaks .cols, .tweaks .presets { display:flex; gap:6px; flex-wrap:wrap }
  .tweaks input[type=color] { width:34px; height:28px; border:0; padding:0; background:none; cursor:pointer }
  .tweaks .presets button { padding:5px 9px; border-radius:8px; background:rgba(255,255,255,.12) }
  .tweaks output { color:var(--mute); text-align:right }

  @media (max-width:1000px) {
    html, body { overflow:auto }
    .app { height:auto; grid-template-columns:1fr; grid-template-rows:none; grid-template-areas:"brand" "strip" "stage" "chat"; padding:18px 16px 24px }
    .stage { grid-template-rows:auto 62vw auto }
    .facts { grid-template-columns:1fr }
    .checks { grid-template-columns:1fr }
    .msgs { max-height:50vh }
  }
  @media (prefers-reduced-motion:reduce) { .layer.kb img { animation:none } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>
<div class="app">
  <header class="brand"><div class="logo">Second Site</div><button class="tw-btn" id="twBtn">Tweaks</button></header>
  <section class="strip" id="strip" aria-label="Ranked spaces"></section>
  <section class="stage">
    <div class="tabs" id="tabs">
      <button data-v="aerial">Aerial</button><button data-v="dollhouse">Dollhouse</button><button data-v="plan">Plan</button><button data-v="inside">Inside</button><a href="tours.html">3D tour ↗</a>
    </div>
    <div class="view" id="view"><span class="src" id="src"></span></div>
    <div class="facts" id="facts"></div>
  </section>
  <aside class="chat">
    <div class="msgs" id="msgs"></div>
    <form id="form" autocomplete="off"><input id="input" aria-label="Message"><button class="send" aria-label="Send">↑</button></form>
  </aside>
</div>
<div class="tweaks" id="tweaks" hidden></div>

<script>
/* Listing facts: CoStar data kit snapshot (asking terms). Images: CoStar, Matterport, Vexcel (mockups/assets).
   Cost / time ranges are illustrative estimates for this mockup, not finance-engine output. */
const BUDGET = 180;
const P = {
  'mateo-109': {
    addr:'915 Mateo St · 109', area:'Arts District · 1,128 SF · open shell', rent:'$2.2k',
    hero:'matterport-03.jpg', aerial:'vexcel-oblique-s.jpg',
    inside:['matterport-03.jpg','matterport-04.jpg','matterport-05.jpg','matterport-01.jpg','matterport-02.jpg'],
    cost:[146,181], time:'4–5 mo', why:'Open shell: every wall and sink is new',
    checks:[['work','3 treatment rooms','Open shell, about 38 m of new walls · Matterport plan'],
      ['work','Plumbing','One restroom, new lines to each room · Matterport photos'],
      ['unknown','Electrical capacity','Panel size not documented'],
      ['ok','Parking and loading','Gated lot and loading dock · CoStar photos']],
    next:['Get a plumbing estimate before shortlisting.','Request quote']
  },
  'sixth-110b': {
    addr:'630 W 6th St · 110B', area:'Downtown · 1,310 SF · former restaurant', rent:'$4.0k',
    hero:'matterport-03.jpg', aerial:'vexcel-oblique-n.jpg',
    inside:['matterport-03.jpg','matterport-02.jpg','matterport-04.jpg','matterport-05.jpg'],
    cost:[200,230], time:'5–6 mo', why:'Kitchen tear-out plus key money',
    checks:[['work','Key money','$75,000 due at signing · CoStar listing notes'],
      ['work','Kitchen removal','Hood and cook line to demolish · Matterport photos'],
      ['ok','Plumbing','Kitchen and restroom lines exist · Matterport photos'],
      ['unknown','Exhaust and grease removal','Scope not documented']],
    next:['Out of budget. Kept for comparison.', null]
  },
  'beverly-720': {
    addr:'1125 S Beverly Dr · 720', area:'Medical tower · 1,490 SF · built-out suite', rent:'$5.2k',
    hero:'matterport-01.jpg', aerial:'vexcel-oblique-e.jpg',
    inside:['matterport-01.jpg','matterport-04.jpg','matterport-02.jpg','matterport-05.jpg','matterport-03.jpg'],
    cost:[72,87], time:'6–8 wk', why:'Rooms and sinks already built',
    checks:[['ok','3 treatment rooms fit','6 enclosed rooms on the scan · Matterport plan'],
      ['ok','Sinks in rooms','Sink cabinets in scan photos · Matterport'],
      ['unknown','Electrical capacity','Sub-panel amps not documented'],
      ['work','Permitted use','Listed as medical office · CoStar listing']],
    next:['Ask the broker about the sub-panel and permitted use.','Ask broker']
  }
};
const S = { step:0, sel:'mateo-109', view:'aerial', order:['mateo-109','sixth-110b','beverly-720'], prev:null, out:{}, tags:{}, msgs:[] };
const SCRIPT = [
  { you:'Second facial studio. 3 treatment rooms, $180k all in, open by March.',
    order:['beverly-720','mateo-109','sixth-110b'], sel:'beverly-720', out:{'sixth-110b':'Out: $75k key money puts it over budget'},
    says:'Beverly moves to first. Highest rent, but the rooms and sinks are already built, so it costs about $80k less to open than Mateo. 6th St is out: the key money alone breaks the budget.' },
  { you:'I would rather avoid plumbing work.', tags:{'mateo-109':'Needs new plumbing to every room'}, flash:true,
    says:'Then Mateo is a stretch: every treatment room needs new supply and drain lines. Beverly has sinks in place. One unknown left there, the electrical sub-panel. Want me to ask the broker?' }
];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img = (slug, f) => `assets/${slug}/${f}`;

/* ---------------- gradient (WebGL) */
const T = { colors:['#232859','#4554a3','#c65a4e','#b4628a','#8db1b6','#d2b8a8'], idle:.035, active:.24, warp:1.2, scale:.9, grain:.35, mouse:.18, blur:20, res:.5 };
const PRESETS = {
  Reference:['#232859','#4554a3','#c65a4e','#b4628a','#8db1b6','#d2b8a8'],
  Dusk:['#1d1b3a','#3b3f8f','#e0745a','#c9578f','#6e8fb8','#f1c9a0'],
  Sea:['#0f2b3d','#1f5f8b','#4fb3a9','#8a7fd1','#bfe3d8','#f0d9b5'],
  Mono:['#1c1c22','#3a3a46','#77727a','#5a5866','#a8a6b0','#d6d3cf']
};
try { Object.assign(T, JSON.parse(localStorage.getItem('ss-tweaks-v3') || '{}')); } catch (e) {}

const gl = $('bg').getContext('webgl', { antialias:false });
const FS = `precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uMouseAmt, uWarp, uScale;
uniform vec3 c0,c1,c2,c3,c4,c5;
float h(vec2 p){ p = fract(p * vec2(.1031, .1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(h(i),h(i+vec2(1,0)),u.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<3;i++){ v+=a*n(p); p=m*p; a*=.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = vec2(uv.x * uRes.x / uRes.y, uv.y) * uScale;
  vec2 m = (uMouse - .5) * uMouseAmt; float t = uTime;
  vec2 q = vec2(fbm(p + vec2(0., t*.5) + m), fbm(p + vec2(5.2,1.3) - t*.35));
  vec2 r = vec2(fbm(p + uWarp*q + vec2(1.7,9.2) + t*.25), fbm(p + uWarp*q + vec2(8.3,2.8) - t*.2 - m));
  float f = fbm(p + uWarp*r);
  vec2 w = uv + (r - .5) * .35;
  float coral = (1.-w.y)*1.05 + (.4-w.x)*.6;
  float glow = 1. - length((w - vec2(.58 + m.x*.3, .98))*vec2(1.5, 2.4));
  float sand = w.x*1.1 + (1.-w.y)*.2 - .55;
  float core = 1. - length((w - vec2(.55, .55))*vec2(.95, 1.15));
  vec3 col = mix(c1, c0, smoothstep(.25, .7, f));
  col = mix(col, c0, smoothstep(.05, .6, core) * .9);
  col = mix(col, c4, smoothstep(.15, .75, glow) * .85);
  col = mix(col, c5, smoothstep(.15, .7, sand) * .85);
  col = mix(col, c3, smoothstep(.5, .85, coral) * .85);
  col = mix(col, c2, smoothstep(.75, 1.15, coral));
  col += (h(gl_FragCoord.xy + t) - .5) / 128.;   /* dither: no 8-bit banding */
  gl_FragColor = vec4(col, 1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = k => gl.getUniformLocation(prog, k);
const hex = c => [1,3,5].map(i => parseInt(c.slice(i, i+2), 16) / 255);
function size() { $('bg').width = innerWidth * T.res; $('bg').height = innerHeight * T.res; gl.viewport(0, 0, $('bg').width, $('bg').height); }
addEventListener('resize', size); size();

// seamless grain: one random tile, no visible seams
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  x.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${c.toDataURL()})`; })();

let gTime = 7, speed = T.idle, generating = false, last = performance.now();
const mouse = { x:.5, y:.5, tx:.5, ty:.5 };
addEventListener('pointermove', e => { mouse.tx = e.clientX / innerWidth; mouse.ty = 1 - e.clientY / innerHeight; });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  speed += ((generating ? T.active : T.idle) - speed) * Math.min(1, dt * 2.5);
  if (!still) gTime += dt * speed;
  mouse.x += (mouse.tx - mouse.x) * Math.min(1, dt * 1.5); mouse.y += (mouse.ty - mouse.y) * Math.min(1, dt * 1.5);
  gl.uniform2f(U('uRes'), $('bg').width, $('bg').height); gl.uniform1f(U('uTime'), gTime); gl.uniform2f(U('uMouse'), mouse.x, mouse.y);
  gl.uniform1f(U('uMouseAmt'), T.mouse); gl.uniform1f(U('uWarp'), T.warp); gl.uniform1f(U('uScale'), T.scale);
  T.colors.forEach((c, i) => gl.uniform3fv(U('c' + i), hex(c)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
})(last);

/* ---------------- stage: aerial / dollhouse / plan / inside */
const VIEWS = {
  aerial:    { depth:0, src:'Vexcel aerial',   kind:'kb',    file:s => img(s, P[s].aerial) },
  dollhouse: { depth:1, src:'Matterport 3D',   kind:'float', file:s => `assets/dollhouses/${s}.png` },
  plan:      { depth:1, src:'Matterport plan', kind:'float', rise:true, file:s => img(s, 'matterport-floorplan-02.png') },
  inside:    { depth:2, src:'Matterport',      kind:'kb',    file:s => img(s, P[s].inside[0]) }
};
let layer = null, insideTimer = null, insideIdx = 0;
function addLayer(src, kind) { const el = document.createElement('div'); el.className = 'layer ' + kind; el.innerHTML = `<img src="${src}" alt="">`; $('view').appendChild(el); return el; }
function show(view, slug = S.sel, force) {
  const from = S.view, V = VIEWS[view], F = VIEWS[from];
  if (view === from && !force && layer) return;
  S.view = view;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('src').textContent = V.src;
  clearInterval(insideTimer);
  const next = addLayer(V.file(slug), V.kind), old = layer; layer = next;
  const opt = { duration:still ? 1 : 950, easing:'cubic-bezier(.65,0,.35,1)', fill:'forwards' };
  let outK, inK;
  if (force && from === view) { outK = [{ opacity:1 }, { opacity:0 }]; inK = [{ opacity:0, transform:'scale(1.03)' }, { opacity:1, transform:'scale(1)' }]; }
  else if (V.rise || F.rise) {
    const up = V.rise ? 1 : -1;
    outK = [{ opacity:1, transform:'none', filter:'blur(0)' }, { opacity:0, transform:`translateY(${18*up}%) scale(${up > 0 ? .9 : 1.12})`, filter:'blur(6px)' }];
    inK = [{ opacity:0, transform:`translateY(${-14*up}%) scale(${up > 0 ? 1.1 : .9})`, filter:'blur(6px)' }, { opacity:1, transform:'none', filter:'blur(0)' }];
  } else {
    const dir = V.depth >= F.depth ? 1 : -1;
    outK = [{ opacity:1, transform:'scale(1)', filter:'blur(0)' }, { opacity:0, transform:`scale(${dir > 0 ? 1.7 : .7})`, filter:'blur(8px)' }];
    inK = [{ opacity:0, transform:`scale(${dir > 0 ? .75 : 1.5})`, filter:'blur(8px)' }, { opacity:1, transform:'scale(1)', filter:'blur(0)' }];
  }
  if (old) old.animate(outK, opt).finished.then(() => old.remove());
  next.animate(inK, opt);
  if (view === 'inside') {
    insideIdx = 0;
    insideTimer = setInterval(() => {
      insideIdx = (insideIdx + 1) % P[S.sel].inside.length;
      const prev = layer, el = addLayer(img(S.sel, P[S.sel].inside[insideIdx]), 'kb'); layer = el;
      el.animate([{ opacity:0, transform:'scale(1.04)' }, { opacity:1, transform:'scale(1)' }], { duration:1400, easing:'ease-in-out', fill:'forwards' });
      prev.animate([{ opacity:1 }, { opacity:0 }], { duration:1400, fill:'forwards' }).finished.then(() => prev.remove());
    }, 3600);
  }
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const v = { 1:'aerial', 2:'dollhouse', 3:'plan', 4:'inside' }[e.key]; if (v) show(v); });

/* ---------------- render */
const live = () => S.order.filter(s => !S.out[s]);
function cardHTML(slug) {
  const p = P[slug], out = S.out[slug], priced = S.step > 0, rank = out ? '' : live().indexOf(slug) + 1;
  let move = '';
  if (S.prev && !out) { const d = S.prev.indexOf(slug) + 1 - rank; if (d) move = `<span class="move">${d > 0 ? '↑' : '↓'}${Math.abs(d)}</span>`; }
  const num = priced ? `<span class="${out ? 'struck' : ''}">$${p.cost[0]}–${p.cost[1]}k</span> <small>est. to open</small>` : `${p.rent} <small>/mo asking</small>`;
  const why = out ? `<span class="reason">${esc(out)}</span>` : S.tags[slug] ? `<span class="reason">${esc(S.tags[slug])}</span>` : `<span class="why">${esc(priced ? p.why : p.area)}</span>`;
  return `<div class="img"><img src="${img(slug, p.hero)}" alt="${esc(p.addr)}">${rank ? `<span class="rank">${rank}</span>` : ''}${move}</div>
    <div class="meta"><span class="addr">${esc(p.addr)}</span><span class="num">${num}</span>${why}</div>`;
}
function renderStrip() {
  const strip = $('strip'), before = {};
  strip.querySelectorAll('.card').forEach(el => before[el.dataset.slug] = el.getBoundingClientRect().left);
  [...live(), ...S.order.filter(s => S.out[s])].forEach(slug => {
    let el = strip.querySelector(`[data-slug="${slug}"]`);
    if (!el) { el = document.createElement('button'); el.className = 'card'; el.dataset.slug = slug; }
    el.innerHTML = cardHTML(slug); el.classList.toggle('sel', slug === S.sel); el.classList.toggle('out', !!S.out[slug]);
    strip.appendChild(el);
  });
  strip.querySelectorAll('.card').forEach(el => {
    const b = before[el.dataset.slug]; if (b == null) return;
    const dx = b - el.getBoundingClientRect().left;
    if (dx) el.animate([{ transform:`translateX(${dx}px)` }, { transform:'none' }], { duration:still ? 1 : 800, easing:'cubic-bezier(.65,0,.35,1)' });
  });
}
function renderFacts() {
  const p = P[S.sel], priced = S.step > 0, [txt, btn] = p.next;
  const nums = priced
    ? [[`$${p.cost[0]}–${p.cost[1]}k`, `est. to open · budget $${BUDGET}k`, p.cost[0] > BUDGET], [p.time, 'est. to open the doors'], [p.rent + '/mo', 'asking rent']]
    : [[p.rent + '/mo', 'asking rent'], ['—', 'cost to open: tell me your rooms']];
  $('facts').innerHTML = `
    <h2>${esc(p.addr)} <span>${esc(p.area)}</span></h2>
    <div class="row1">
      <div class="nums">${nums.map(([v, l, over]) => `<div class="n${over ? ' over' : ''}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
      ${priced ? `<div class="next"><p>${esc(txt)}</p>${btn ? `<button id="act">${esc(btn)}</button>` : ''}</div>` : ''}
    </div>
    <div class="checks">${p.checks.map(([st, l, d]) => `<div class="check ${st}"><i class="dot" title="${st === 'ok' ? 'Meets requirement' : st === 'work' ? 'May require work' : 'Unknown'}"></i><b>${esc(l)}</b><span>${esc(d)}</span></div>`).join('')}</div>`;
  const act = $('act');
  if (act) act.onclick = () => { act.textContent = 'Waiting for your approval'; act.classList.add('done'); };
}
function select(slug) {
  if (slug === S.sel) return;
  S.sel = slug;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.slug === slug));
  renderFacts(); show(S.view, slug, true);
}
$('strip').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) select(c.dataset.slug); });

/* ---------------- chat (scripted for the mockup) */
function bubble(who, html) { const el = document.createElement('div'); el.className = 'b ' + who; el.innerHTML = html; $('msgs').appendChild(el); $('msgs').scrollTop = 1e9; return el; }
function stream(text, done) {
  generating = true;
  const el = bubble('ai', '<span class="caret"></span>');
  let i = 0;
  (function tick() {
    i = Math.min(text.length, i + 2);
    el.innerHTML = esc(text.slice(0, i)) + (i < text.length ? '<span class="caret"></span>' : '');
    $('msgs').scrollTop = 1e9;
    if (i < text.length) setTimeout(tick, 22); else { generating = false; done && done(); }
  })();
}
function send(text) {
  const step = SCRIPT[S.step];
  bubble('me', esc(text)); $('input').value = '';
  if (!step) { stream('Noted. I will fold that into the next pass.'); return; }
  generating = true;
  setTimeout(() => {
    S.step++;
    if (step.order) { S.prev = live(); S.order = step.order; }
    if (step.out) Object.assign(S.out, step.out);
    if (step.tags) Object.assign(S.tags, step.tags);
    renderStrip();
    if (step.sel && step.sel !== S.sel) select(step.sel); else renderFacts();
    if (step.flash) document.querySelectorAll('.check.unknown').forEach(el => el.classList.add('flash'));
    stream(step.says, () => { $('input').value = SCRIPT[S.step] ? SCRIPT[S.step].you : ''; $('input').placeholder = 'Ask anything'; });
  }, 600);
}
$('form').addEventListener('submit', e => { e.preventDefault(); const t = $('input').value.trim(); if (t) send(t); });

/* ---------------- tweaks */
function apply() { const r = document.documentElement.style; r.setProperty('--blur', T.blur + 'px'); r.setProperty('--grain', T.grain); }
function save() { try { localStorage.setItem('ss-tweaks-v3', JSON.stringify(T)); } catch (e) {} }
const SL = [['idle','Idle speed',0,.2,.005],['active','Typing speed',0,.8,.01],['warp','Warp',0,3,.05],['scale','Scale',.4,2.5,.05],['grain','Grain',0,1,.02],['mouse','Mouse pull',0,.6,.01],['blur','Blur',0,40,1]];
function renderTweaks() {
  $('tweaks').innerHTML = `<div class="presets">${Object.keys(PRESETS).map(k => `<button data-p="${k}">${k}</button>`).join('')}</div>
    <div class="cols">${T.colors.map((c, i) => `<input type="color" data-c="${i}" value="${c}">`).join('')}</div>
    ${SL.map(([k, l, a, b, st]) => `<label class="row"><span>${l}</span><input type="range" data-k="${k}" min="${a}" max="${b}" step="${st}" value="${T[k]}"><output>${T[k]}</output></label>`).join('')}
    <div class="presets"><button data-a="gen">Preview typing</button><button data-a="reset">Reset</button></div>`;
}
$('tweaks').addEventListener('input', e => { const t = e.target;
  if (t.dataset.c) T.colors[+t.dataset.c] = t.value;
  if (t.dataset.k) { T[t.dataset.k] = +t.value; t.nextElementSibling.textContent = t.value; }
  apply(); save(); });
$('tweaks').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { T.colors = [...PRESETS[b.dataset.p]]; renderTweaks(); save(); }
  if (b.dataset.a === 'gen') { generating = true; setTimeout(() => generating = false, 3000); }
  if (b.dataset.a === 'reset') { try { localStorage.removeItem('ss-tweaks-v3'); } catch (e) {} location.reload(); } });
$('twBtn').onclick = () => { $('tweaks').hidden = !$('tweaks').hidden; if (!$('tweaks').hidden) renderTweaks(); };

/* ---------------- boot */
apply(); renderStrip(); renderFacts();
bubble('ai', 'Tell me what you are opening and I will rank these by what they would really cost to open.');
$('input').value = SCRIPT[0].you;
show('aerial', S.sel, true);
</script>
</body>
