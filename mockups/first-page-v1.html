<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Site</title>
<style>
  :root {
    --bg:#fff; --ink:#111; --ink2:#3a3a3c; --mute:#8e8e93; --fill:#f2f2f7;
    --green:#248a3d; --red:#d70015; --r:18px;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100% }
  body { background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer }

  .app { display:grid; grid-template-columns:360px minmax(420px,1fr) minmax(320px,38%); height:100vh }

  /* conversation */
  .chat { display:flex; flex-direction:column; gap:20px; padding:28px 24px 20px; min-height:0 }
  .brand { font-weight:600; letter-spacing:-.01em }
  .profile { display:flex; flex-wrap:wrap; gap:6px }
  .chip { background:var(--fill); border-radius:999px; padding:5px 11px; font-size:13px; transition:opacity .4s }
  .chip.inferred { opacity:.5 }
  .chip.enter { animation:pop .4s cubic-bezier(.2,.8,.2,1) }
  @keyframes pop { from { opacity:0; transform:scale(.85) } }
  .thread { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; min-height:0; overflow:auto }
  .you { align-self:flex-end; max-width:85%; background:var(--fill); color:var(--ink2); border-radius:18px; padding:9px 14px }
  .says { font-size:20px; line-height:1.35; letter-spacing:-.01em }
  .says.thinking { color:var(--mute) }
  form { display:flex; align-items:center; background:var(--fill); border-radius:22px; padding:4px 4px 4px 16px }
  input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; color:var(--ink) }
  .send { width:36px; height:36px; border-radius:50%; background:var(--ink); color:#fff; font-size:17px; flex:none }

  /* ranked spaces */
  .list { overflow:auto; padding:28px 20px 48px; display:flex; flex-direction:column; gap:32px }
  .card { transition:opacity .35s, max-height .45s ease; max-height:1200px }
  .card.gone { opacity:0; max-height:0; margin-top:-32px; overflow:hidden }
  .media { position:relative; aspect-ratio:16/10; border-radius:var(--r); overflow:hidden; background:var(--fill); cursor:pointer; transition:box-shadow .2s }
  .card.hl .media { box-shadow:0 8px 28px rgba(0,0,0,.18) }
  .media img { width:100%; height:100%; object-fit:cover; display:block }
  .media img.dark { object-fit:contain; background:#000 }
  .src { position:absolute; left:12px; bottom:12px; font-size:12px; color:#fff; background:rgba(0,0,0,.45); border-radius:8px; padding:3px 8px }
  .dots { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:5px }
  .dots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5) }
  .dots i.on { background:#fff }
  .acts { position:absolute; top:12px; right:12px; display:flex; gap:8px }
  .acts button { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.94); box-shadow:0 2px 8px rgba(0,0,0,.12); font-size:16px }
  .card.liked .like { background:var(--ink); color:#fff }
  .meta { display:grid; gap:2px; padding:14px 4px 0 }
  .row { display:flex; align-items:baseline; gap:10px }
  .rank { color:var(--mute); font-weight:600; font-variant-numeric:tabular-nums }
  .addr { font-size:17px; font-weight:600; letter-spacing:-.01em }
  .move { font-size:13px; font-weight:600 }
  .up { color:var(--green) } .down { color:var(--mute) }
  .big { font-size:28px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:4px }
  .big small { font-size:14px; font-weight:400; letter-spacing:0; color:var(--mute) }
  .big.over { color:var(--red) }
  .why { color:var(--ink2) }
  .fit { color:var(--mute); font-size:13px }

  .map { padding:12px 12px 12px 0 }
  .map iframe { width:100%; height:100%; border:0; border-radius:var(--r); display:block }

  @media (max-width:1100px) { .app { grid-template-columns:340px 1fr } .map { display:none } }
  @media (max-width:760px) {
    .app { display:block; height:auto }
    .chat { padding:20px 16px 0 }
    .thread { justify-content:flex-start }
    form { position:fixed; left:16px; right:16px; bottom:12px; z-index:2; box-shadow:0 4px 18px rgba(0,0,0,.08) }
    .list { overflow:visible; padding:24px 16px 96px }
    .says { font-size:18px }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="chat">
    <div class="brand">Second Site</div>
    <div class="profile" id="profile"></div>
    <div class="thread" id="thread"></div>
    <form id="form" autocomplete="off">
      <input id="input" aria-label="Message">
      <button class="send" aria-label="Send">↑</button>
    </form>
  </aside>
  <main class="list" id="list"></main>
  <div class="map"><iframe id="map" src="map/index.html" title="Map of ranked spaces"></iframe></div>
</div>

<script>
// Listing facts: CoStar data kit snapshot (asking terms). Images: CoStar, Matterport, Vexcel via mockups/assets.
// Cost-to-open ranges are illustrative estimates for the mockup, not finance-engine output yet.
const BUDGET = 180;
const SPACES = {
  'mateo-109': {
    addr: '915 Mateo St · 109', area: 'Arts District · 1,128 SF', rent: '$2.2k/mo',
    imgs: [['matterport-03.jpg','Matterport'], ['matterport-dollhouse.jpg','Matterport 3D',1], ['costar-01.jpg','CoStar'], ['vexcel-oblique-s.jpg','Vexcel aerial']],
    cost: [146, 181], why: 'Open shell, so every wall and sink is new', fit: '1 bathroom · plumbing capacity unknown',
    pass: 'Skipped. Fewer raw shells from here.'
  },
  'sixth-110b': {
    addr: '630 W 6th St · 110B', area: 'Downtown · 1,310 SF', rent: '$4.0k/mo',
    imgs: [['matterport-03.jpg','Matterport'], ['matterport-dollhouse.jpg','Matterport 3D',1], ['costar-01.jpg','CoStar'], ['vexcel-oblique-n.jpg','Vexcel aerial']],
    cost: [200, 230], why: 'Kitchen tear-out plus $75k key money', fit: 'Key money from listing notes · plumbing in place',
    pass: 'Skipped. Fewer former restaurants from here.'
  },
  'beverly-720': {
    addr: '1125 S Beverly Dr · 720', area: 'Medical tower · 1,490 SF', rent: '$5.2k/mo',
    imgs: [['matterport-01.jpg','Matterport'], ['matterport-dollhouse.jpg','Matterport 3D',1], ['costar-01.jpg','CoStar'], ['vexcel-oblique-e.jpg','Vexcel aerial']],
    cost: [72, 87], why: 'Rooms and sinks already built', fit: '6 rooms framed · sink cabinets (Matterport)',
    pass: 'Skipped. I will weigh location more.'
  }
};

const S = {
  step: 0,
  order: ['mateo-109', 'sixth-110b', 'beverly-720'],
  prev: null,
  chips: [['Facial studio'], ['Los Angeles'], ['$180k all in'], ['2nd location']],
  you: 'Opening my second facial studio in LA. $180k all in.',
  says: 'Three spaces fit on rent. How many treatment rooms do you need?',
  liked: new Set(), passed: new Set(), photo: {}
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const live = () => S.order.filter(s => !S.passed.has(s));

function renderChat() {
  $('profile').innerHTML = S.chips.map(([t, inferred, fresh]) =>
    `<span class="chip${inferred ? ' inferred' : ''}${fresh ? ' enter' : ''}" title="${inferred ? 'Inferred, tap to correct' : 'You said this'}">${esc(t)}</span>`).join('');
  S.chips.forEach(c => c[2] = 0);
  $('thread').innerHTML = (S.you ? `<div class="you">${esc(S.you)}</div>` : '') +
    `<div class="says${S.thinking ? ' thinking' : ''}">${esc(S.says)}</div>`;
}

function cardHTML(slug) {
  const p = SPACES[slug], i = S.photo[slug] || 0, [file, src, dark] = p.imgs[i];
  const rank = live().indexOf(slug) + 1;
  let move = '';
  if (S.prev) {
    const d = S.prev.indexOf(slug) + 1 - rank;
    if (d) move = `<span class="move ${d > 0 ? 'up' : 'down'}">${d > 0 ? '↑' : '↓'}${Math.abs(d)}</span>`;
  }
  const priced = S.step > 0;
  const big = priced
    ? `<div class="big${p.cost[0] > BUDGET ? ' over' : ''}">$${p.cost[0]}–${p.cost[1]}k <small>est. to open · of $${BUDGET}k</small></div>`
    : `<div class="big">${p.rent} <small>asking · cost to open needs room count</small></div>`;
  return `
    <div class="media" data-act="photo">
      <img class="${dark ? 'dark' : ''}" src="assets/${slug}/${file}" alt="${esc(p.addr)}, ${esc(src)}">
      <span class="src">${esc(src)}</span>
      <div class="dots">${p.imgs.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="acts">
        <button class="like" data-act="like" aria-label="Like">♥</button>
        <button data-act="pass" aria-label="Pass">✕</button>
      </div>
    </div>
    <div class="meta">
      <div class="row"><span class="rank">${rank}</span><span class="addr">${esc(p.addr)}</span>${move}</div>
      ${big}
      ${priced ? `<div class="why">${esc(p.why)}</div><div class="fit">${esc(p.area)} · ${p.rent} · ${esc(p.fit)}</div>`
               : `<div class="fit">${esc(p.area)}</div>`}
    </div>`;
}

// Render cards, animating position changes (FLIP).
function renderList() {
  const list = $('list');
  const before = {};
  list.querySelectorAll('.card').forEach(el => before[el.dataset.slug] = el.getBoundingClientRect().top);
  S.order.forEach(slug => {
    let el = list.querySelector(`[data-slug="${slug}"]`);
    if (!el) { el = document.createElement('article'); el.className = 'card'; el.dataset.slug = slug; }
    el.innerHTML = cardHTML(slug);
    el.classList.toggle('liked', S.liked.has(slug));
    list.appendChild(el);
  });
  list.querySelectorAll('.card').forEach(el => {
    const b = before[el.dataset.slug];
    if (b == null) return;
    const dy = b - el.getBoundingClientRect().top;
    if (!dy) return;
    el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = ''; });
  });
}

function render() { renderChat(); renderList(); syncMap(); }

// Conversation script (mockup): first reply teaches rooms + plumbing and re-ranks by cost to open.
function send(text) {
  S.you = text; S.thinking = true; S.says = 'Reading floor plans and listing notes…';
  renderChat();
  setTimeout(() => {
    S.thinking = false;
    if (S.step === 0) {
      S.step = 1;
      S.chips.push(['3 treatment rooms', 0, 1], ['Less plumbing work', 1, 1]);
      S.prev = live();
      S.order = ['beverly-720', 'mateo-109', 'sixth-110b'];
      S.says = 'Beverly moves to first. Highest rent, but the rooms and sinks are already built, so it costs about $80k less to open than Mateo.';
      $('input').value = ''; $('input').placeholder = 'Ask anything, or like / pass a space';
    } else {
      S.prev = null;
      S.says = 'Noted. I will factor that in on the next pass.';
    }
    render();
  }, 900);
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('input').value.trim();
  if (t) { $('input').value = ''; send(t); }
});

$('list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('.card'), slug = card.dataset.slug, p = SPACES[slug];
  const act = btn.dataset.act;
  e.stopPropagation();
  if (act === 'photo') {
    S.photo[slug] = ((S.photo[slug] || 0) + 1) % p.imgs.length;
    card.innerHTML = cardHTML(slug);
    return;
  }
  S.prev = null;
  if (act === 'like') {
    if (S.liked.has(slug)) S.liked.delete(slug);
    else {
      S.liked.add(slug);
      if (slug === 'beverly-720' && !S.chips.some(c => c[0] === 'Move-in ready')) S.chips.push(['Move-in ready', 1, 1]);
      S.you = null; S.says = 'Noted. Move-in-ready suites rank higher.';
    }
  }
  if (act === 'pass') {
    S.passed.add(slug); card.classList.add('gone');
    S.you = null; S.says = p.pass;
    setTimeout(() => { card.remove(); S.order = S.order.filter(s => s !== slug); renderList(); syncMap(); }, 450);
  }
  renderChat(); if (act === 'like') renderList();
});

// Map sync: embedded Zillow-style map (mockups/map) exposes window.ssMap.
let ssMap = null, placeData = null;
function syncMap() {
  if (!ssMap || !placeData) return;
  ssMap.setPlaces(live().map(s => placeData[s]).filter(Boolean));
}
$('list').addEventListener('mouseover', e => { const c = e.target.closest('.card'); if (c && ssMap) ssMap.highlight(c.dataset.slug); });
$('list').addEventListener('mouseleave', () => ssMap && ssMap.highlight(null));
$('map').addEventListener('load', () => {
  const w = $('map').contentWindow;
  const ready = () => {
    if (!w.ssMap) return setTimeout(ready, 100);
    ssMap = w.ssMap;
    ssMap.onSelect(slug => {
      const el = slug && $('list').querySelector(`[data-slug="${slug}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    if (ssMap.onHighlight) ssMap.onHighlight(slug => {
      document.querySelectorAll('.card').forEach(c => c.classList.toggle('hl', c.dataset.slug === slug));
    });
    syncMap();
  };
  ready();
});
fetch('assets/places.json').then(r => r.json()).then(a => {
  placeData = Object.fromEntries(a.map(p => [p.slug, p])); syncMap();
}).catch(() => {});

$('input').value = 'Three treatment rooms. I would rather not redo plumbing.';
render();
</script>
</body>
</html>
