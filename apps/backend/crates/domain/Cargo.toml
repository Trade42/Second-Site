[package]
name = "ss-domain"
version = "0.1.0"
edition = "2021"
publish = false
description = "Second Site domain contracts and deterministic engines (no HTTP, no database)"

[dependencies]
ss-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse JSON floats exactly (correctly rounded), as Python does; ss-server enables it too.
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
regex = "1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
csv = "1"
# Polygon overlay (intersection, union, difference) and robust orientation predicates for the
# Shapely-based layout validation; no default features (no threads, no triangulation).
geo = { version = "0.33", default-features = false }
# Telnyx client_state and webhook signatures (base64, hmac, sha2: the versions ss-server uses;
# ed25519-dalek: maintained Ed25519 verification, no hand-written cryptography).
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
ed25519-dalek = "2"

[dev-dependencies]
indexmap = "2"
jsonschema = { version = "0.61.2", default-features = false }
