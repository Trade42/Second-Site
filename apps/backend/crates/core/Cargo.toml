[package]
name = "ss-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Second Site shared primitives and project/business-profile contracts (port of apps/api/app/contracts/{common,state,project}.py)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
serde_path_to_error = "0.1"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
