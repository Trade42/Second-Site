[project]
name = "second-site-api"
version = "0.1.0"
description = "Second Site backend: FastAPI + domain services + LangChain Deep Agents supervisor"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "langgraph-checkpoint-postgres",
  "langchain-anthropic",
  "httpx",
  "redis",
  "deepagents",
  "langchain",
  "langgraph",
  "shapely",
  "ortools",
  "cryptography",
  "python-multipart",
]

[project.optional-dependencies]
ifc = ["ifcopenshell"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: requires a reachable PostgreSQL (DATABASE_URL)",
  "live: calls a live external provider (opt-in via RUN_LIVE_TESTS=1)",
  "ifc: requires ifcopenshell (optional extra)",
]
