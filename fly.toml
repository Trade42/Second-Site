app = "secondsite-photon"
primary_region = "ewr"

[build]
  dockerfile = "infra/docker/fly.Dockerfile"

[env]
  APP_ENV = "development"
  ALLOW_DEV_TOKENS = "false"
  MESSAGING_PROVIDER_MODE = "live"
  VOICE_PROVIDER_MODE = "fixture"
  TASK_EXECUTION_MODE = "inline"
  PUBLIC_BASE_URL = "https://secondsite-photon.fly.dev"
  PUBLIC_WEB_URL = "https://secondsite-photon.fly.dev"
  PHOTON_PROJECT_ID = "pho_prj_01m7e1sk8vfahstwhd7jakay5y"
  PHOTON_AGENT_HANDLE = "+16289979661"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[[mounts]]
  source = "ss_data"
  destination = "/data"
